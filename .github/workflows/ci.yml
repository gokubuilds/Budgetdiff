name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with Ruff
        run: ruff check .

      - name: Run unit & integration tests
        run: pytest -q
        env:
          ENVIRONMENT: test
          GEMINI_API_KEY: ""

      - name: Build Docker image
        run: docker build -t budgetdiff-api:ci .

      - name: Run Docker container for smoke test
        run: |
          docker run -d --name smoke-api -p 8000:8000 -e ENVIRONMENT=ci -e APP_NAME=BudgetDiff budgetdiff-api:ci

      - name: Wait for API and smoke test /health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health | grep '"status":"ok"'; then
              echo "Smoke test passed: /health returned HTTP 200 OK"
              exit 0
            fi
            echo "Waiting for container startup (attempt $i)..."
            sleep 2
          done
          echo "Smoke test failed: /health did not return HTTP 200 in time"
          docker logs smoke-api
          exit 1

      - name: Clean up smoke test container
        if: always()
        run: |
          docker rm -f smoke-api || true
